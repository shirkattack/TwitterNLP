method: grid
metric:
  goal: maximize
  name: cats_macro_auc
command:
  - ${env}
  - ${interpreter}
  - scripts/sweep_from_config.py
  - ./corpus/gpu_config.cfg
  - ./training
parameters:
  components.textcat.model.conv_depth:
    values:
    - 2
    - 3
    - 4
  components.textcat.model.ngram_size:
    values:
    - 1
    - 2
    - 3
  training.dropout:
    distribution: uniform
    max: 0.5
    min: 0.05
  training.optimizer.learn_rate:
    distribution: uniform
    max: 0.01
    min: 0.001