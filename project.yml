title: "Detecting cryptocurrency scams on Twitter (Text Classification)"
description: "This project uses [spaCy](https://spacy.io) with tweets annotated in [Prodigy](https://prodi.gy) to train a **binary text classifier** that flags tweets discussing scams and fraud in cryptocurrency (`RELEVANT` vs `IRRELEVANT`)."

# Variables can be referenced across the project.yml using ${vars.var_name}
vars:
  config: "config.cfg"   # one of: config.cfg (CPU, bag-of-words), cnn.cfg, bert.cfg (GPU)
  name: "twitter_scam_textcat"
  version: "0.1.0"
  train: "train"
  dev: "dev"
  gpu_id: -1             # set to a GPU device id to train on GPU

# These are the directories that the project needs. The project CLI will make
# sure that they always exist.
directories: ["assets", "training", "configs", "scripts", "corpus", "patterns"]

# Assets that should be downloaded or available in the directory.
assets:
  - dest: "assets/${vars.train}.jsonl"
    description: "JSONL-formatted training data exported from Prodigy (binary accept/reject annotations)"
  - dest: "assets/${vars.dev}.jsonl"
    description: "JSONL-formatted development data exported from Prodigy (binary accept/reject annotations)"
  - dest: "assets/vectors.zip"
    url: "https://dl.fbaipublicfiles.com/fasttext/vectors-english/crawl-300d-2M.vec.zip"
    description: "fastText English vectors, only needed by the init-vectors command"

# Workflows are sequences of commands (see below) executed in order. You can
# run them via "spacy project run [workflow]". If a commands's inputs/outputs
# haven't changed, it won't be re-run.
workflows:
  all:
    - preprocess
    - train
    - evaluate

# Project commands, specified in a style similar to CI config files (e.g. Azure
# pipelines). The name is the command name that lets you trigger the command
# via "spacy project run [command] [path]". The help message is optional and
# shown when executing "spacy project run [optional command] [path] --help".
commands:
  - name: "init-vectors"
    help: "Convert the downloaded fastText vectors into a spaCy vectors model"
    script:
      - "python -m spacy init vectors en assets/vectors.zip assets/en_fasttext_vectors"
    deps:
      - "assets/vectors.zip"
    outputs_no_cache:
      - "assets/en_fasttext_vectors"

  - name: "preprocess"
    help: "Convert the JSONL annotations to spaCy's binary format"
    script:
      - "python scripts/preprocess.py assets/${vars.train}.jsonl corpus/${vars.train}.spacy"
      - "python scripts/preprocess.py assets/${vars.dev}.jsonl corpus/${vars.dev}.spacy"
    deps:
      - "assets/${vars.train}.jsonl"
      - "assets/${vars.dev}.jsonl"
      - "scripts/preprocess.py"
    outputs:
      - "corpus/${vars.train}.spacy"
      - "corpus/${vars.dev}.spacy"

  - name: "init-labels"
    help: "Generate the label files for the training config"
    script:
      - "python -m spacy init labels configs/${vars.config} corpus/labels --gpu-id ${vars.gpu_id}"
    deps:
      - "corpus/${vars.train}.spacy"
    outputs:
      - "corpus/labels/textcat_multilabel.json"

  - name: "train"
    help: "Train the text classification model"
    script:
      - "python -m spacy train configs/${vars.config} --output training/ --paths.train corpus/${vars.train}.spacy --paths.dev corpus/${vars.dev}.spacy --gpu-id ${vars.gpu_id}"
    deps:
      - "corpus/${vars.train}.spacy"
      - "corpus/${vars.dev}.spacy"
      - "configs/${vars.config}"
    outputs:
      - "training/model-best"

  - name: "evaluate"
    help: "Evaluate the model and export metrics"
    script:
      - "python -m spacy evaluate training/model-best corpus/${vars.dev}.spacy --output training/metrics.json"
    deps:
      - "corpus/${vars.dev}.spacy"
      - "training/model-best"
    outputs:
      - "training/metrics.json"

  - name: "sweep"
    help: "Run a Bayesian W&B hyperparameter sweep (requires `wandb login`)"
    script:
      - "python scripts/spacy_sweeps.py corpus/gpu_config.cfg training --gpu-id ${vars.gpu_id}"
    deps:
      - "corpus/${vars.train}.spacy"
      - "corpus/${vars.dev}.spacy"
      - "corpus/gpu_config.cfg"

  - name: "visualize"
    help: "Launch the Streamlit demo for the trained model"
    script:
      - "streamlit run scripts/visualize.py"
    deps:
      - "scripts/visualize.py"
      - "training/model-best"

  - name: "package"
    help: "Package the trained model as a pip package"
    script:
      - "python -m spacy package training/model-best packages --name ${vars.name} --version ${vars.version} --force"
    deps:
      - "training/model-best"
    outputs_no_cache:
      - "packages/en_${vars.name}-${vars.version}/dist/en_${vars.name}-${vars.version}.tar.gz"
